[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rpa-llm-bridge"
version = "2.7.0"
description = "企业 RPA 与智能体之间的双向桥：MCP 工具层 + 声明式 Recipe + 策略闸门（v0.1 内核），以及 RPA ↔ Codex/Claude/dsh/豆包 的网关与 SDK（v2.0）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "c8xm" }]
keywords = ["rpa", "mcp", "agent", "playwright", "automation", "llm", "yingdao", "codex", "gateway"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "mcp[cli]>=1.27,<2",
  "playwright>=1.54,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
desktop = ["pywinauto>=0.6.8"]
office = ["openpyxl>=3.1", "python-docx>=1.1"]
all = ["pywinauto>=0.6.8", "openpyxl>=3.1", "python-docx>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/c8xm/rpa-llm-bridge"
Documentation = "https://github.com/c8xm/rpa-llm-bridge/blob/main/docs/USAGE.md"
Issues = "https://github.com/c8xm/rpa-llm-bridge/issues"

[project.scripts]
agentrpa = "server:main"
agentrpa-gateway = "agentrpa_bridge.gateway:main"
agentrpa-rpa-mcp = "agentrpa_bridge.yingdao_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["agentrpa", "agentrpa_bridge"]

# 入口 agentrpa = "server:main" 要求 server.py 落在 site-packages 根；
# 影刀 SDK 也必须随包分发，否则 pip 装完拿不到 rpa_agent_block.py
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"sdk/rpa_agent_block.py" = "agentrpa_bridge/sdk/rpa_agent_block.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["agentrpa", "agentrpa_bridge"]
# 驱动层要真实浏览器/桌面/Office，CI 里跑不起来；它们的逻辑靠 fake driver 与策略用例覆盖
omit = ["agentrpa/drivers/*"]

[tool.coverage.report]
skip_covered = true
# 当前基线 82%（Linux）；跨平台会有 1–2 点波动，门槛留余量
fail_under = 78

[tool.ruff]
line-length = 112
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# 测试要先把仓库根塞进 sys.path，导入必然在语句之后
"tests/*" = ["E402"]
# 历史文件与生成脚本的排版不做强制
"server.py" = ["E501"]
"scripts/*" = ["E501"]
