name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov pyyaml python-dotenv

      - name: Unit tests + coverage gate
        run: python -m pytest --cov --cov-report=term --cov-report=xml
        env:
          PYTHONUTF8: "1"

      - name: Bridge smoke test (zero-dependency demo)
        run: python examples/local_demo.py
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-py314-preview:
    name: pytest (ubuntu / py3.14, 允许失败)
    runs-on: ubuntu-latest
    continue-on-error: true      # 3.14 预发布支持：失败不挡合并，但要看得见
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov pyyaml python-dotenv
      - run: python -m pytest --cov --cov-report=term
        env:
          PYTHONUTF8: "1"

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Syntax and undefined-name checks
        run: ruff check agentrpa agentrpa_bridge sdk server.py tests --select E9,F63,F7,F82

  package:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
